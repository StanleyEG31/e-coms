<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gadgets - ShopEase</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="logo-container">
      <div class="logo">ShopEase</div>
      <div class="logo-subtext">Formerly Alice + Whittles</div>
    </div>
    <div class="search-cart">
      <input type="text" placeholder="Search..." class="search-input" />
      <span class="../cart-icon">🛒</span>

  </header>

  <section class="product-list">
    <a href="../home.html" class="back-home-btn">
        ← Back Home
      </a>
    <h2>🎮 Gadgets</h2>
    <div class="product-grid">
    <div class="product-card" onclick=" location.href='../product.html?id=5'">
      <img src="../images/console.png" alt="Ps5 Controller">
      <h4>Ps5 Controller</h4>
      <p>₱2,999</p>
    </div>

    <div class="product-card" onclick=" location.href='../product.html?id=6'">
      <img src="../images/nintendo.png" alt="Nintedo Switch">
      <h4>Nintedo Switch</h4>
      <p>₱3,999</p>
    </div>
  </div>
  </section>
</body>
</html>
